<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
	<meta name="theme-color" content="#d3ece2">
	<title>Dress Party — You're Invited!</title>

	<link rel="preload" as="image" href="screen1_bg.webp">
	<link rel="preload" as="image" href="screen2_bg.webp">
	<link rel="preload" as="image" href="graphic_dress.svg">
	<link rel="preload" as="image" href="text_dress-party.svg">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">

	<style>
		:root {
			--pink: #d75c80;
			--pink-light: #f9cde0;
			--olive: #4a541e;
			--olive-dark: #454f1c;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			height: 100%;
			overflow: hidden;
			overscroll-behavior: none;
			font-family: 'Roboto', -apple-system, sans-serif;
			background: #d3ece2;
			-webkit-tap-highlight-color: transparent;
		}

		/* ---------- Pager (snap container) ---------- */
		.pager {
			position: fixed;
			inset: 0;
			overflow-y: auto;
			scroll-snap-type: y mandatory;
			scrollbar-width: none;
		}

		.pager::-webkit-scrollbar {
			display: none;
		}

		.screen {
			position: relative;
			height: 100%;
			overflow: hidden;
			scroll-snap-align: start;
			scroll-snap-stop: always;
		}

		/* Parallax layers — JS moves .layer, CSS animates children */
		.layer {
			position: absolute;
			left: 0;
			right: 0;
			will-change: transform;
		}

		/* ---------- Screen 1 ---------- */
		.s1-bg {
			top: -12%;
			height: 124%;
		}

		.s1-bg img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			will-change: transform;
			backface-visibility: hidden;
			animation: kenburns 24s ease-in-out infinite alternate;
		}

		@keyframes kenburns {
			from {
				transform: scale(1);
			}

			to {
				transform: scale(1.07);
			}
		}

		.s1-title {
			top: 0;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.s1-title img {
			width: min(76vw, 430px);
			opacity: 0;
			animation:
				title-in 1.4s cubic-bezier(.22, 1.2, .36, 1) .35s forwards,
				floaty 7s ease-in-out 1.75s infinite alternate;
		}

		@keyframes title-in {
			from {
				opacity: 0;
				transform: translateY(26px) scale(.92);
			}

			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		@keyframes floaty {
			from {
				transform: translateY(0);
			}

			to {
				transform: translateY(-9px);
			}
		}

		.hint {
			position: absolute;
			bottom: calc(96px + env(safe-area-inset-bottom));
			left: 0;
			right: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 4px;
			color: var(--pink);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: .18em;
			text-transform: uppercase;
			opacity: 0;
			animation: hint-in .8s ease .8s forwards;
			pointer-events: none;
		}

		@keyframes hint-in {
			to {
				opacity: 1;
			}
		}

		.hint svg {
			width: 26px;
			height: 26px;
			animation: bob 1.6s ease-in-out infinite;
		}

		@keyframes bob {

			0%,
			100% {
				transform: translateY(0);
			}

			50% {
				transform: translateY(-7px);
			}
		}

		/* ---------- Screen 2 ---------- */
		.screen-2 {
			background: #fbdcea;
		}

		.s2-bg {
			top: -12%;
			height: 124%;
		}

		.s2-bg img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.s2-dress {
			top: 2%;
			height: 112%;
		}

		.s2-dress img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: top center;
			transform: translateY(3%) scale(1.015);
			opacity: 0;
			will-change: transform, opacity;
			backface-visibility: hidden;
			transition: transform 1.1s cubic-bezier(.22, 1, .36, 1), opacity .9s ease;
		}

		.screen-2.active .s2-dress img {
			transform: translateY(0) scale(1);
			opacity: 1;
		}

		.s2-content {
			top: 0;
			height: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
			padding: 0 9vw calc(3dvh + env(safe-area-inset-bottom));
		}

		/* Text block sits in the space above the buttons, nudged down from center */
		.s2-text {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: 100%;
			padding-top: clamp(5dvh, 10dvh, 100px);
		}

		/* staged entrances */
		.s2-title,
		.s2-blurb,
		.s2-divider,
		.s2-date,
		.s2-address,
		.s2-actions {
			opacity: 0;
			transform: translateY(22px);
			transition: opacity .65s ease, transform .65s cubic-bezier(.22, 1.1, .36, 1);
		}

		.screen-2.active .s2-title,
		.screen-2.active .s2-blurb,
		.screen-2.active .s2-divider,
		.screen-2.active .s2-date,
		.screen-2.active .s2-address,
		.screen-2.active .s2-actions {
			opacity: 1;
			transform: translateY(0);
		}

		.screen-2.active .s2-title {
			transition-delay: .15s;
		}

		.screen-2.active .s2-blurb {
			transition-delay: .34s;
		}

		.screen-2.active .s2-divider {
			transition-delay: .46s;
		}

		.screen-2.active .s2-date {
			transition-delay: .56s;
		}

		.screen-2.active .s2-address {
			transition-delay: .66s;
		}

		.screen-2.active .s2-actions {
			transition-delay: .8s;
		}

		.s2-title {
			width: min(72vw, 370px);
			max-height: 25dvh;
			display: flex;
			justify-content: center;
		}

		.s2-title img {
			max-width: 100%;
			max-height: 100%;
			height: auto;
			display: block;
		}

		.s2-blurb {
			margin-top: clamp(1.4dvh, 2.4dvh, 22px);
			max-width: 21ch;
			font-size: clamp(16px, 5vw, 23px);
			font-weight: 700;
			line-height: 1.18;
			color: var(--olive);
		}

		.s2-divider {
			margin-top: clamp(1.2dvh, 1.9dvh, 18px);
			width: min(52vw, 280px);
		}

		.s2-divider img {
			width: 100%;
			display: block;
		}

		.screen-2.active .s2-divider img {
			animation: divider-pop .7s cubic-bezier(.22, 1.3, .36, 1) .46s both;
		}

		@keyframes divider-pop {
			from {
				transform: scaleX(.4);
				opacity: 0;
			}

			to {
				transform: scaleX(1);
				opacity: 1;
			}
		}

		.s2-date {
			margin-top: clamp(1.6dvh, 2.4dvh, 26px);
			font-size: clamp(21px, 6.4vw, 29px);
			font-weight: 700;
			color: var(--olive);
		}

		.s2-address {
			margin-top: clamp(0.8dvh, 1.4dvh, 14px);
			font-size: clamp(13px, 3.9vw, 17px);
			font-weight: 500;
			line-height: 1.3;
			color: var(--olive);
		}

		.s2-actions {
			flex: none;
			width: min(78vw, 380px);
			display: flex;
			flex-direction: column;
			gap: clamp(8px, 1.4dvh, 12px);
		}

		.s2-cta {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			width: 100%;
			padding: clamp(12px, 1.8dvh, 16px) 0;
			border: none;
			border-radius: 999px;
			background: var(--pink);
			color: #fff;
			font-family: inherit;
			font-size: clamp(17px, 4.8vw, 20px);
			font-weight: 500;
			text-decoration: none;
			cursor: pointer;
			box-shadow: 0 6px 22px rgba(215, 92, 128, .32);
			transition: transform .2s cubic-bezier(.22, 1.1, .36, 1), box-shadow .3s ease;
		}

		.s2-cta svg {
			width: 21px;
			height: 21px;
			flex: none;
		}

		.s2-cta:active {
			transform: scale(.97);
			box-shadow: 0 3px 10px rgba(215, 92, 128, .35);
		}

		/* ---------- Maps chooser sheet ---------- */
		.sheet[hidden],
		.sheet-backdrop[hidden] {
			display: none;
		}

		.sheet-backdrop {
			position: fixed;
			inset: 0;
			background: rgba(52, 40, 30, .45);
			opacity: 0;
			transition: opacity .3s ease;
			z-index: 20;
		}

		.sheet-backdrop.show {
			opacity: 1;
		}

		.sheet {
			position: fixed;
			left: 0;
			right: 0;
			bottom: 0;
			z-index: 21;
			display: flex;
			flex-direction: column;
			gap: 12px;
			padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
			background: #fff;
			border-radius: 26px 26px 0 0;
			box-shadow: 0 -10px 40px rgba(52, 40, 30, .22);
			transform: translateY(110%);
			transition: transform .42s cubic-bezier(.22, 1, .36, 1);
		}

		.sheet.show {
			transform: translateY(0);
		}

		.sheet-title {
			text-align: center;
			font-size: 15px;
			font-weight: 700;
			letter-spacing: .04em;
			color: #9a8f80;
			margin-bottom: 4px;
		}

		.sheet-option {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			padding: 16px 0;
			border-radius: 16px;
			background: #f4f2ea;
			color: var(--olive-dark);
			font-family: inherit;
			font-size: 19px;
			font-weight: 700;
			text-decoration: none;
			transition: transform .12s ease, background .12s ease;
		}

		.sheet-option svg {
			width: 22px;
			height: 22px;
			color: var(--pink);
		}

		.sheet-option:active {
			transform: scale(.98);
			background: #ece9df;
		}

		.sheet-cancel {
			margin-top: 2px;
			padding: 15px 0;
			border: none;
			border-radius: 16px;
			background: transparent;
			color: #9a8f80;
			font-family: inherit;
			font-size: 17px;
			font-weight: 700;
			cursor: pointer;
		}

		.sheet-cancel:active {
			background: #f4f2ea;
		}

		/* ---------- Reduced motion ---------- */
		@media (prefers-reduced-motion: reduce) {

			*,
			*::before,
			*::after {
				animation-duration: .01ms !important;
				animation-delay: 0s !important;
				transition-duration: .01ms !important;
				transition-delay: 0s !important;
			}
		}
	</style>
</head>

<body>

	<div class="pager" id="pager">

		<!-- Screen 1 -->
		<section class="screen screen-1">
			<div class="layer s1-bg" data-depth="0.30">
				<img src="screen1_bg.webp" alt="" draggable="false">
			</div>
			<div class="layer s1-title" data-depth="0.14">
				<img src="text_dress-party.svg" alt="Dress Party" draggable="false">
			</div>
			<div class="hint" id="hint">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="6 14.5 12 8.5 18 14.5" />
				</svg>
				Swipe up
			</div>
		</section>

		<!-- Screen 2 -->
		<section class="screen screen-2" id="screen2">
			<div class="layer s2-bg" data-depth="0.30">
				<img src="screen2_bg.webp" alt="" draggable="false">
			</div>
			<div class="layer s2-dress" data-depth="0.12">
				<img src="graphic_dress.svg" alt="" draggable="false">
			</div>
			<div class="layer s2-content" data-depth="0">
				<div class="s2-text">
					<div class="s2-title">
						<img src="text_leave-your-mark.svg" alt="Leave Your Mark" draggable="false">
					</div>
					<p class="s2-blurb">Join us for activities, treats, and a fun celebration.</p>
					<div class="s2-divider">
						<img src="graphic_divider.svg" alt="" draggable="false">
					</div>
					<p class="s2-date">July 25th @ 3pm</p>
					<p class="s2-address">1778 Irish Spring Ct<br>Middleburg, FL 32068</p>
				</div>
				<div class="s2-actions">
					<button class="s2-cta" id="directionsBtn" type="button" aria-haspopup="dialog" aria-controls="mapSheet">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z" />
							<circle cx="12" cy="10" r="3" />
						</svg>
						Get Directions
					</button>
					<button class="s2-cta" id="calendarBtn" type="button" aria-haspopup="dialog" aria-controls="calSheet">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<rect x="3" y="4.5" width="18" height="17" rx="2.5" />
							<line x1="16" y1="2.5" x2="16" y2="6.5" />
							<line x1="8" y1="2.5" x2="8" y2="6.5" />
							<line x1="3" y1="10" x2="21" y2="10" />
						</svg>
						Add to Calendar
					</button>
				</div>
			</div>
		</section>

	</div>

	<!-- Maps chooser -->
	<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
	<div class="sheet" id="mapSheet" role="dialog" aria-modal="true" aria-label="Choose a maps app" hidden>
		<p class="sheet-title">Get Directions with</p>
		<a class="sheet-option" id="appleMapsLink" href="https://maps.apple.com/?daddr=1778%20Irish%20Spring%20Ct,%20Middleburg,%20FL%2032068" target="_blank" rel="noopener">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z" />
				<circle cx="12" cy="10" r="3" />
			</svg>
			Apple Maps
		</a>
		<a class="sheet-option" id="googleMapsLink" href="https://www.google.com/maps/dir/?api=1&destination=1778+Irish+Spring+Ct%2C+Middleburg%2C+FL+32068" target="_blank" rel="noopener">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<polygon points="3 11 22 2 13 21 11 13 3 11" />
			</svg>
			Google Maps
		</a>
		<button class="sheet-cancel" type="button" data-close>Cancel</button>
	</div>

	<!-- Calendar chooser -->
	<div class="sheet" id="calSheet" role="dialog" aria-modal="true" aria-label="Choose a calendar" hidden>
		<p class="sheet-title">Add to Calendar</p>
		<a class="sheet-option" id="appleCalLink" href="#" download="dress-party.ics">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<rect x="3" y="4.5" width="18" height="17" rx="2.5" />
				<line x1="16" y1="2.5" x2="16" y2="6.5" />
				<line x1="8" y1="2.5" x2="8" y2="6.5" />
				<line x1="3" y1="10" x2="21" y2="10" />
			</svg>
			Apple Calendar
		</a>
		<a class="sheet-option" id="googleCalLink" href="#" target="_blank" rel="noopener">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<rect x="3" y="4.5" width="18" height="17" rx="2.5" />
				<line x1="16" y1="2.5" x2="16" y2="6.5" />
				<line x1="8" y1="2.5" x2="8" y2="6.5" />
				<line x1="3" y1="10" x2="21" y2="10" />
			</svg>
			Google Calendar
		</a>
		<button class="sheet-cancel" type="button" data-close>Cancel</button>
	</div>

	<script>
		(function () {
			const pager = document.getElementById('pager');
			const hint = document.getElementById('hint');
			const screen2 = document.getElementById('screen2');
			const screens = Array.from(document.querySelectorAll('.screen'));
			const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

			let vh = pager.clientHeight;

			// Cache the moving layers once so the scroll loop never touches the DOM to find them
			const parallax = [];
			screens.forEach((screen, i) => {
				screen.querySelectorAll('.layer').forEach(layer => {
					const depth = parseFloat(layer.dataset.depth) || 0;
					if (depth) parallax.push({ layer, depth, i });
				});
			});

			window.addEventListener('resize', () => { vh = pager.clientHeight; update(); });

			// Parallax: each layer shifts by depth * its section's offset from the viewport
			let hintHidden = false;
			function update() {
				const scrollTop = pager.scrollTop;

				if (!reduced) {
					for (let k = 0; k < parallax.length; k++) {
						const { layer, depth, i } = parallax[k];
						const sectionOffset = i * vh - scrollTop; // px from viewport top
						layer.style.transform = 'translate3d(0,' + (-sectionOffset * depth).toFixed(2) + 'px,0)';
					}
				}

				// Fade the swipe hint out once scrolling starts — only write when the state flips
				const shouldHide = scrollTop > vh * 0.04;
				if (shouldHide !== hintHidden) {
					hint.style.opacity = shouldHide ? 0 : '';
					hintHidden = shouldHide;
				}
			}

			let ticking = false;
			pager.addEventListener('scroll', () => {
				if (!ticking) {
					ticking = true;
					requestAnimationFrame(() => { ticking = false; update(); });
				}
			}, { passive: true });

			// Stage screen-2 entrances when it becomes the active page
			new IntersectionObserver(entries => {
				entries.forEach(e => screen2.classList.toggle('active', e.intersectionRatio > 0.55));
			}, { root: pager, threshold: [0.55] }).observe(screen2);

			// Bottom-sheet choosers (maps + calendar)
			const backdrop = document.getElementById('sheetBackdrop');
			const mapSheet = document.getElementById('mapSheet');
			const calSheet = document.getElementById('calSheet');
			const allSheets = [mapSheet, calSheet];
			let openSheetEl = null, closeTimer;

			function openSheet(el) {
				clearTimeout(closeTimer);
				openSheetEl = el;
				backdrop.hidden = false;
				el.hidden = false;
				requestAnimationFrame(() => { backdrop.classList.add('show'); el.classList.add('show'); });
			}
			function closeSheet() {
				backdrop.classList.remove('show');
				allSheets.forEach(s => s.classList.remove('show'));
				clearTimeout(closeTimer);
				const el = openSheetEl;
				closeTimer = setTimeout(() => { backdrop.hidden = true; if (el) el.hidden = true; openSheetEl = null; }, reduced ? 0 : 460);
			}

			document.getElementById('directionsBtn').addEventListener('click', () => openSheet(mapSheet));
			document.getElementById('calendarBtn').addEventListener('click', () => openSheet(calSheet));
			backdrop.addEventListener('click', closeSheet);
			document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
			allSheets.forEach(s => s.querySelectorAll('.sheet-option').forEach(a => a.addEventListener('click', () => setTimeout(closeSheet, 150))));
			document.addEventListener('keydown', e => { if (e.key === 'Escape' && openSheetEl) closeSheet(); });

			// Calendar links — Fri Jul 25 2026, 3:00–5:00 PM ET, Middleburg FL
			(function buildCalendar() {
				const title = 'Dress Party — Leave Your Mark';
				const details = 'Join us for activities, treats, and a fun celebration.';
				const place = '1778 Irish Spring Ct, Middleburg, FL 32068';
				const start = '20260725T150000', end = '20260725T170000', tz = 'America/New_York';

				document.getElementById('googleCalLink').href =
					'https://calendar.google.com/calendar/render?action=TEMPLATE'
					+ '&text=' + encodeURIComponent(title)
					+ '&dates=' + start + '/' + end
					+ '&ctz=' + encodeURIComponent(tz)
					+ '&details=' + encodeURIComponent(details)
					+ '&location=' + encodeURIComponent(place);

				const ics = [
					'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Dress Party//Invite//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
					'BEGIN:VTIMEZONE', 'TZID:America/New_York',
					'BEGIN:DAYLIGHT', 'TZOFFSETFROM:-0500', 'TZOFFSETTO:-0400', 'TZNAME:EDT', 'DTSTART:19700308T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU', 'END:DAYLIGHT',
					'BEGIN:STANDARD', 'TZOFFSETFROM:-0400', 'TZOFFSETTO:-0500', 'TZNAME:EST', 'DTSTART:19701101T020000', 'RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU', 'END:STANDARD',
					'END:VTIMEZONE',
					'BEGIN:VEVENT',
					'UID:dress-party-20260725@invite',
					'DTSTAMP:20260701T120000Z',
					'DTSTART;TZID=' + tz + ':' + start,
					'DTEND;TZID=' + tz + ':' + end,
					'SUMMARY:' + title,
					'DESCRIPTION:' + details,
					'LOCATION:' + place,
					'END:VEVENT', 'END:VCALENDAR'
				].join('\r\n');
				document.getElementById('appleCalLink').href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
			})();

			update();
		})();
	</script>
